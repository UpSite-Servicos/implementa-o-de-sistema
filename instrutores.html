<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instrutores - UpSite (SISGED, MVP estático)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="conteudo-pagina" class="d-none">
  <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
    <h2 class="page-title mb-0">Instrutores</h2>
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalInstrutor" onclick="abrirNovo()">+ Novo Instrutor</button>
  </div>

  <div id="msg-sucesso" class="alert alert-success d-none"></div>

  <div class="form-card mb-3">
    <input type="text" id="busca" class="form-control" placeholder="Buscar por nome, e-mail ou especialidade..." oninput="renderizar()">
  </div>

  <div class="form-card">
    <div class="table-responsive">
      <table class="table table-sisged table-hover align-middle">
        <thead><tr><th>Nome</th><th>E-mail</th><th>Telefone</th><th>Especialidade</th><th class="text-end">Ações</th></tr></thead>
        <tbody id="tabela-instrutores"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- Modal de cadastro/edição -->
<div class="modal fade" id="modalInstrutor" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="form-instrutor">
        <div class="modal-header"><h5 class="modal-title" id="tituloModal">Novo Instrutor</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
          <input type="hidden" id="instrutor-id">
          <div class="mb-3"><label class="form-label">Nome completo *</label><input type="text" id="instrutor-nome" class="form-control" required></div>
          <div class="mb-3"><label class="form-label">E-mail *</label><input type="email" id="instrutor-email" class="form-control" required></div>
          <div class="mb-3"><label class="form-label">Telefone</label><input type="text" id="instrutor-telefone" class="form-control"></div>
          <div class="mb-3"><label class="form-label">Especialidade</label><input type="text" id="instrutor-especialidade" class="form-control"></div>
          <div id="erro-instrutor" class="alert alert-danger py-2 d-none"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary">Salvar</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/layout.js"></script>
<script>
  exigirLogin();
  exigirPerfil(["coordenacao"]);

  function renderizar() {
    const termo = document.getElementById("busca").value.toLowerCase();
    const lista = DB.instrutores.filter((i) =>
      i.nome.toLowerCase().includes(termo) || i.email.toLowerCase().includes(termo) || (i.especialidade || "").toLowerCase().includes(termo)
    );
    const tbody = document.getElementById("tabela-instrutores");
    tbody.innerHTML = lista.length === 0
      ? `<tr><td colspan="5" class="text-center text-muted py-4">Nenhum instrutor encontrado.</td></tr>`
      : lista.map((i) => `
        <tr>
          <td>${i.nome}</td><td>${i.email}</td><td>${i.telefone || ""}</td><td>${i.especialidade || ""}</td>
          <td class="text-end">
            <button class="btn btn-sm btn-outline-primary" data-bs-toggle="modal" data-bs-target="#modalInstrutor" onclick="abrirEdicao(${i.id})">Editar</button>
            <button class="btn btn-sm btn-outline-danger" onclick="excluir(${i.id})">Excluir</button>
          </td>
        </tr>`).join("");
  }

  function abrirNovo() {
    document.getElementById("form-instrutor").reset();
    document.getElementById("instrutor-id").value = "";
    document.getElementById("tituloModal").textContent = "Novo Instrutor";
    document.getElementById("erro-instrutor").classList.add("d-none");
  }

  function abrirEdicao(id) {
    const i = DB.instrutores.find((x) => x.id === id);
    document.getElementById("instrutor-id").value = i.id;
    document.getElementById("instrutor-nome").value = i.nome;
    document.getElementById("instrutor-email").value = i.email;
    document.getElementById("instrutor-telefone").value = i.telefone || "";
    document.getElementById("instrutor-especialidade").value = i.especialidade || "";
    document.getElementById("tituloModal").textContent = "Editar Instrutor";
    document.getElementById("erro-instrutor").classList.add("d-none");
  }

  function excluir(id) {
    if (!confirm("Excluir este instrutor? (ação simulada, apenas neste navegador)")) return;
    DB.instrutores = DB.instrutores.filter((i) => i.id !== id);
    persistir();
    renderizar();
  }

  document.getElementById("form-instrutor").addEventListener("submit", function (ev) {
    ev.preventDefault();
    const id = document.getElementById("instrutor-id").value;
    const nome = document.getElementById("instrutor-nome").value.trim();
    const email = document.getElementById("instrutor-email").value.trim();
    const telefone = document.getElementById("instrutor-telefone").value.trim();
    const especialidade = document.getElementById("instrutor-especialidade").value.trim();
    const erroBox = document.getElementById("erro-instrutor");

    if (!nome || !email) { erroBox.textContent = "Nome e e-mail são obrigatórios."; erroBox.classList.remove("d-none"); return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { erroBox.textContent = "Informe um e-mail válido."; erroBox.classList.remove("d-none"); return; }
    const duplicado = DB.instrutores.some((i) => i.email === email && String(i.id) !== id);
    if (duplicado) { erroBox.textContent = "Já existe um instrutor cadastrado com esse e-mail."; erroBox.classList.remove("d-none"); return; }

    if (id) {
      const i = DB.instrutores.find((x) => x.id === Number(id));
      Object.assign(i, { nome, email, telefone, especialidade });
    } else {
      const novoId = Math.max(0, ...DB.instrutores.map((i) => i.id)) + 1;
      DB.instrutores.push({ id: novoId, nome, email, telefone, especialidade });
    }
    persistir();
    bootstrap.Modal.getInstance(document.getElementById("modalInstrutor")).hide();
    const msg = document.getElementById("msg-sucesso");
    msg.textContent = id ? "Instrutor atualizado com sucesso." : "Instrutor cadastrado com sucesso.";
    msg.classList.remove("d-none");
    renderizar();
  });

  renderizar();
  montarLayout("instrutores.html");
</script>
</body>
</html>
