<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel - UpSite (SISGED, MVP estático)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="conteudo-pagina" class="d-none">
  <h2 class="page-title" id="saudacao">Olá! 👋</h2>
  <p class="text-muted mb-4">Perfil: <span class="text-capitalize fw-semibold" id="perfil-label"></span></p>

  <div class="row g-3 mb-4" id="cards-resumo"></div>

  <div class="form-card">
    <h5 class="mb-3">Próximas aulas agendadas</h5>
    <div class="table-responsive">
      <table class="table table-sisged table-hover align-middle">
        <thead><tr><th>Data</th><th>Horário</th><th>Turma</th><th>Sala</th><th>Instrutor</th><th>Status</th></tr></thead>
        <tbody id="tabela-proximas-aulas"></tbody>
      </table>
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/layout.js"></script>
<script>
  exigirLogin();
  const usuario = usuarioLogado();
  document.getElementById("saudacao").textContent = `Olá, ${usuario.nome} 👋`;
  document.getElementById("perfil-label").textContent = usuario.perfil;

  function nomeDe(lista, id) { const r = lista.find((x) => x.id === id); return r ? r.nome : "-"; }

  // Filtra aulas conforme o perfil, igual a versão PHP
  let aulasVisiveis = DB.aulas;
  if (usuario.perfil === "instrutor") {
    aulasVisiveis = DB.aulas.filter((a) => a.instrutorId === usuario.referenciaId);
  } else if (usuario.perfil === "aluno") {
    const minhasTurmas = DB.alunos.find((a) => a.id === usuario.referenciaId)?.turmas || [];
    aulasVisiveis = DB.aulas.filter((a) => minhasTurmas.includes(a.turmaId));
  }
  aulasVisiveis = aulasVisiveis.filter((a) => a.status === "Agendada").slice(0, 8);

  const tbody = document.getElementById("tabela-proximas-aulas");
  if (aulasVisiveis.length === 0) {
    tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted py-4">Nenhuma aula agendada.</td></tr>`;
  } else {
    tbody.innerHTML = aulasVisiveis.map((a) => `
      <tr>
        <td>${a.data.split("-").reverse().join("/")}</td>
        <td>${a.horaInicio} - ${a.horaFim}</td>
        <td>${nomeDe(DB.turmas, a.turmaId)}</td>
        <td>${nomeDe(DB.salas, a.salaId)}</td>
        <td>${nomeDe(DB.instrutores, a.instrutorId)}</td>
        <td><span class="badge badge-status-${a.status}">${a.status}</span></td>
      </tr>`).join("");
  }

  // Cards de resumo, variando por perfil (mesma lógica do dashboard.php original)
  const cores = ["bg-cor-1", "bg-cor-2", "bg-cor-3", "bg-cor-4"];
  let totais = {};
  if (usuario.perfil === "coordenacao") {
    totais = {
      "Instrutores": DB.instrutores.length, "Alunos": DB.alunos.length,
      "Turmas": DB.turmas.length, "Salas": DB.salas.length,
    };
  } else if (usuario.perfil === "instrutor") {
    totais = {
      "Minhas Turmas": DB.turmas.filter((t) => t.instrutorId === usuario.referenciaId).length,
      "Próximas Aulas": aulasVisiveis.length,
    };
  } else {
    totais = { "Minhas Turmas": (DB.alunos.find((a) => a.id === usuario.referenciaId)?.turmas || []).length };
  }
  document.getElementById("cards-resumo").innerHTML = Object.entries(totais).map(([rotulo, valor], i) => `
    <div class="col-6 col-md-3">
      <div class="card-resumo ${cores[i % cores.length]}">
        <div class="valor">${valor}</div>
        <div class="rotulo">${rotulo}</div>
      </div>
    </div>`).join("");

  montarLayout("dashboard.html");
</script>
</body>
</html>
