<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salas - UpSite (SISGED, MVP estático)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="conteudo-pagina" class="d-none">
  <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
    <h2 class="page-title mb-0">Salas</h2>
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalSala" onclick="abrirNovo()">+ Nova Sala</button>
  </div>
  <div id="msg-sucesso" class="alert alert-success d-none"></div>
  <div class="form-card">
    <div class="table-responsive">
      <table class="table table-sisged table-hover align-middle">
        <thead><tr><th>Nome</th><th>Capacidade</th><th>Localização</th><th>Recursos</th><th class="text-end">Ações</th></tr></thead>
        <tbody id="tabela-salas"></tbody>
      </table>
    </div>
  </div>
</div>

<div class="modal fade" id="modalSala" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="form-sala">
        <div class="modal-header"><h5 class="modal-title" id="tituloModal">Nova Sala</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
          <input type="hidden" id="sala-id">
          <div class="mb-3"><label class="form-label">Nome da sala *</label><input type="text" id="sala-nome" class="form-control" required></div>
          <div class="mb-3"><label class="form-label">Capacidade *</label><input type="number" min="1" id="sala-capacidade" class="form-control" required></div>
          <div class="mb-3"><label class="form-label">Localização</label><input type="text" id="sala-localizacao" class="form-control"></div>
          <div class="mb-3"><label class="form-label">Recursos</label><input type="text" id="sala-recursos" class="form-control"></div>
          <div id="erro-sala" class="alert alert-danger py-2 d-none"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary">Salvar</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/layout.js"></script>
<script>
  exigirLogin();
  exigirPerfil(["coordenacao"]);

  function renderizar() {
    document.getElementById("tabela-salas").innerHTML = DB.salas.length === 0
      ? `<tr><td colspan="5" class="text-center text-muted py-4">Nenhuma sala cadastrada.</td></tr>`
      : DB.salas.map((s) => `
        <tr>
          <td>${s.nome}</td><td>${s.capacidade} lugares</td><td>${s.localizacao || ""}</td><td>${s.recursos || ""}</td>
          <td class="text-end">
            <button class="btn btn-sm btn-outline-primary" data-bs-toggle="modal" data-bs-target="#modalSala" onclick="abrirEdicao(${s.id})">Editar</button>
            <button class="btn btn-sm btn-outline-danger" onclick="excluir(${s.id})">Excluir</button>
          </td>
        </tr>`).join("");
  }

  function abrirNovo() {
    document.getElementById("form-sala").reset();
    document.getElementById("sala-id").value = "";
    document.getElementById("tituloModal").textContent = "Nova Sala";
    document.getElementById("erro-sala").classList.add("d-none");
  }

  function abrirEdicao(id) {
    const s = DB.salas.find((x) => x.id === id);
    document.getElementById("sala-id").value = s.id;
    document.getElementById("sala-nome").value = s.nome;
    document.getElementById("sala-capacidade").value = s.capacidade;
    document.getElementById("sala-localizacao").value = s.localizacao || "";
    document.getElementById("sala-recursos").value = s.recursos || "";
    document.getElementById("tituloModal").textContent = "Editar Sala";
    document.getElementById("erro-sala").classList.add("d-none");
  }

  function excluir(id) {
    if (!confirm("Excluir esta sala? (ação simulada, apenas neste navegador)")) return;
    const emUso = DB.aulas.some((a) => a.salaId === id);
    if (emUso) { alert("Não é possível excluir: esta sala está vinculada a aulas cadastradas."); return; }
    DB.salas = DB.salas.filter((s) => s.id !== id);
    persistir();
    renderizar();
  }

  document.getElementById("form-sala").addEventListener("submit", function (ev) {
    ev.preventDefault();
    const id = document.getElementById("sala-id").value;
    const nome = document.getElementById("sala-nome").value.trim();
    const capacidade = Number(document.getElementById("sala-capacidade").value);
    const localizacao = document.getElementById("sala-localizacao").value.trim();
    const recursos = document.getElementById("sala-recursos").value.trim();
    const erroBox = document.getElementById("erro-sala");

    if (!nome || !(capacidade > 0)) { erroBox.textContent = "Nome e capacidade (maior que zero) são obrigatórios."; erroBox.classList.remove("d-none"); return; }

    if (id) {
      const s = DB.salas.find((x) => x.id === Number(id));
      Object.assign(s, { nome, capacidade, localizacao, recursos });
    } else {
      const novoId = Math.max(0, ...DB.salas.map((s) => s.id)) + 1;
      DB.salas.push({ id: novoId, nome, capacidade, localizacao, recursos });
    }
    persistir();
    bootstrap.Modal.getInstance(document.getElementById("modalSala")).hide();
    const msg = document.getElementById("msg-sucesso");
    msg.textContent = id ? "Sala atualizada com sucesso." : "Sala cadastrada com sucesso.";
    msg.classList.remove("d-none");
    renderizar();
  });

  renderizar();
  montarLayout("salas.html");
</script>
</body>
</html>
