<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alunos - UpSite (SISGED, MVP estático)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="conteudo-pagina" class="d-none">
  <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
    <h2 class="page-title mb-0">Alunos</h2>
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalAluno" onclick="abrirNovo()">+ Novo Aluno</button>
  </div>
  <div id="msg-sucesso" class="alert alert-success d-none"></div>
  <div class="form-card mb-3">
    <input type="text" id="busca" class="form-control" placeholder="Buscar por nome, e-mail ou matrícula..." oninput="renderizar()">
  </div>
  <div class="form-card">
    <div class="table-responsive">
      <table class="table table-sisged table-hover align-middle">
        <thead><tr><th>Matrícula</th><th>Nome</th><th>E-mail</th><th>Telefone</th><th class="text-end">Ações</th></tr></thead>
        <tbody id="tabela-alunos"></tbody>
      </table>
    </div>
  </div>
</div>

<div class="modal fade" id="modalAluno" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="form-aluno">
        <div class="modal-header"><h5 class="modal-title" id="tituloModal">Novo Aluno</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
          <input type="hidden" id="aluno-id">
          <div class="mb-3"><label class="form-label">Nome completo *</label><input type="text" id="aluno-nome" class="form-control" required></div>
          <div class="mb-3"><label class="form-label">Matrícula *</label><input type="text" id="aluno-matricula" class="form-control" required></div>
          <div class="mb-3"><label class="form-label">E-mail *</label><input type="email" id="aluno-email" class="form-control" required></div>
          <div class="mb-3"><label class="form-label">Telefone</label><input type="text" id="aluno-telefone" class="form-control"></div>
          <div class="mb-3"><label class="form-label">Turmas matriculadas</label><div id="caixa-turmas"></div></div>
          <div id="erro-aluno" class="alert alert-danger py-2 d-none"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary">Salvar</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/layout.js"></script>
<script>
  exigirLogin();
  exigirPerfil(["coordenacao"]);

  function renderizar() {
    const termo = document.getElementById("busca").value.toLowerCase();
    const lista = DB.alunos.filter((a) =>
      a.nome.toLowerCase().includes(termo) || a.email.toLowerCase().includes(termo) || a.matricula.toLowerCase().includes(termo)
    );
    document.getElementById("tabela-alunos").innerHTML = lista.length === 0
      ? `<tr><td colspan="5" class="text-center text-muted py-4">Nenhum aluno encontrado.</td></tr>`
      : lista.map((a) => `
        <tr>
          <td>${a.matricula}</td><td>${a.nome}</td><td>${a.email}</td><td>${a.telefone || ""}</td>
          <td class="text-end">
            <button class="btn btn-sm btn-outline-primary" data-bs-toggle="modal" data-bs-target="#modalAluno" onclick="abrirEdicao(${a.id})">Editar</button>
            <button class="btn btn-sm btn-outline-danger" onclick="excluir(${a.id})">Excluir</button>
          </td>
        </tr>`).join("");
  }

  function montarCaixaTurmas(turmasSelecionadas) {
    turmasSelecionadas = turmasSelecionadas || [];
    document.getElementById("caixa-turmas").innerHTML = DB.turmas.map((t) => `
      <div class="form-check">
        <input class="form-check-input" type="checkbox" value="${t.id}" id="turma${t.id}" ${turmasSelecionadas.includes(t.id) ? "checked" : ""}>
        <label class="form-check-label" for="turma${t.id}">${t.nome}</label>
      </div>`).join("");
  }

  function abrirNovo() {
    document.getElementById("form-aluno").reset();
    document.getElementById("aluno-id").value = "";
    document.getElementById("tituloModal").textContent = "Novo Aluno";
    document.getElementById("erro-aluno").classList.add("d-none");
    montarCaixaTurmas([]);
  }

  function abrirEdicao(id) {
    const a = DB.alunos.find((x) => x.id === id);
    document.getElementById("aluno-id").value = a.id;
    document.getElementById("aluno-nome").value = a.nome;
    document.getElementById("aluno-matricula").value = a.matricula;
    document.getElementById("aluno-email").value = a.email;
    document.getElementById("aluno-telefone").value = a.telefone || "";
    document.getElementById("tituloModal").textContent = "Editar Aluno";
    document.getElementById("erro-aluno").classList.add("d-none");
    montarCaixaTurmas(a.turmas);
  }

  function excluir(id) {
    if (!confirm("Excluir este aluno? (ação simulada, apenas neste navegador)")) return;
    DB.alunos = DB.alunos.filter((a) => a.id !== id);
    persistir();
    renderizar();
  }

  document.getElementById("form-aluno").addEventListener("submit", function (ev) {
    ev.preventDefault();
    const id = document.getElementById("aluno-id").value;
    const nome = document.getElementById("aluno-nome").value.trim();
    const matricula = document.getElementById("aluno-matricula").value.trim();
    const email = document.getElementById("aluno-email").value.trim();
    const telefone = document.getElementById("aluno-telefone").value.trim();
    const turmasSelecionadas = Array.from(document.querySelectorAll("#caixa-turmas input:checked")).map((c) => Number(c.value));
    const erroBox = document.getElementById("erro-aluno");

    if (!nome || !email || !matricula) { erroBox.textContent = "Nome, e-mail e matrícula são obrigatórios."; erroBox.classList.remove("d-none"); return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { erroBox.textContent = "Informe um e-mail válido."; erroBox.classList.remove("d-none"); return; }
    const duplicado = DB.alunos.some((a) => (a.email === email || a.matricula === matricula) && String(a.id) !== id);
    if (duplicado) { erroBox.textContent = "Já existe um aluno cadastrado com esse e-mail ou matrícula."; erroBox.classList.remove("d-none"); return; }

    if (id) {
      const a = DB.alunos.find((x) => x.id === Number(id));
      Object.assign(a, { nome, matricula, email, telefone, turmas: turmasSelecionadas });
    } else {
      const novoId = Math.max(0, ...DB.alunos.map((a) => a.id)) + 1;
      DB.alunos.push({ id: novoId, nome, matricula, email, telefone, turmas: turmasSelecionadas });
    }
    persistir();
    bootstrap.Modal.getInstance(document.getElementById("modalAluno")).hide();
    const msg = document.getElementById("msg-sucesso");
    msg.textContent = id ? "Aluno atualizado com sucesso." : "Aluno cadastrado com sucesso.";
    msg.classList.remove("d-none");
    renderizar();
  });

  renderizar();
  montarLayout("alunos.html");
</script>
</body>
</html>
