<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Turmas - UpSite (SISGED, MVP estático)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="conteudo-pagina" class="d-none">
  <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
    <h2 class="page-title mb-0" id="titulo-pagina">Turmas</h2>
    <button class="btn btn-primary d-none" id="btn-nova-turma" data-bs-toggle="modal" data-bs-target="#modalTurma" onclick="abrirNovo()">+ Nova Turma</button>
  </div>
  <div id="msg-sucesso" class="alert alert-success d-none"></div>
  <div class="form-card">
    <div class="table-responsive">
      <table class="table table-sisged table-hover align-middle">
        <thead><tr><th>Nome</th><th>Disciplina</th><th>Instrutor</th><th>Turno</th><th>Alunos</th><th class="text-end d-none" id="th-acoes">Ações</th></tr></thead>
        <tbody id="tabela-turmas"></tbody>
      </table>
    </div>
  </div>
</div>

<div class="modal fade" id="modalTurma" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="form-turma">
        <div class="modal-header"><h5 class="modal-title" id="tituloModal">Nova Turma</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
          <input type="hidden" id="turma-id">
          <div class="mb-3"><label class="form-label">Nome da turma *</label><input type="text" id="turma-nome" class="form-control" required></div>
          <div class="mb-3"><label class="form-label">Disciplina *</label><input type="text" id="turma-disciplina" class="form-control" required></div>
          <div class="mb-3"><label class="form-label">Instrutor responsável *</label><select id="turma-instrutor" class="form-select" required></select></div>
          <div class="mb-3"><label class="form-label">Turno</label>
            <select id="turma-turno" class="form-select">
              <option>Manhã</option><option>Tarde</option><option>Noite</option>
            </select>
          </div>
          <div id="erro-turma" class="alert alert-danger py-2 d-none"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary">Salvar</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/layout.js"></script>
<script>
  exigirLogin();
  const usuario = usuarioLogado();
  const ehCoordenacao = usuario.perfil === "coordenacao";

  if (ehCoordenacao) {
    document.getElementById("btn-nova-turma").classList.remove("d-none");
    document.getElementById("th-acoes").classList.remove("d-none");
  } else {
    document.getElementById("titulo-pagina").textContent = "Minhas Turmas";
  }

  function turmasVisiveis() {
    if (ehCoordenacao) return DB.turmas;
    if (usuario.perfil === "instrutor") return DB.turmas.filter((t) => t.instrutorId === usuario.referenciaId);
    const minhas = DB.alunos.find((a) => a.id === usuario.referenciaId)?.turmas || [];
    return DB.turmas.filter((t) => minhas.includes(t.id));
  }

  function nomeInstrutor(id) { return DB.instrutores.find((i) => i.id === id)?.nome || "—"; }
  function totalAlunos(turmaId) { return DB.alunos.filter((a) => a.turmas.includes(turmaId)).length; }

  function renderizar() {
    const lista = turmasVisiveis();
    document.getElementById("tabela-turmas").innerHTML = lista.length === 0
      ? `<tr><td colspan="6" class="text-center text-muted py-4">Nenhuma turma encontrada.</td></tr>`
      : lista.map((t) => `
        <tr>
          <td>${t.nome}</td><td>${t.disciplina}</td><td>${nomeInstrutor(t.instrutorId)}</td><td>${t.turno}</td><td>${totalAlunos(t.id)}</td>
          <td class="text-end ${ehCoordenacao ? "" : "d-none"}">
            <button class="btn btn-sm btn-outline-primary" data-bs-toggle="modal" data-bs-target="#modalTurma" onclick="abrirEdicao(${t.id})">Editar</button>
            <button class="btn btn-sm btn-outline-danger" onclick="excluir(${t.id})">Excluir</button>
          </td>
        </tr>`).join("");
  }

  function montarSelectInstrutores(selecionadoId) {
    document.getElementById("turma-instrutor").innerHTML =
      `<option value="">Selecione...</option>` +
      DB.instrutores.map((i) => `<option value="${i.id}" ${i.id === selecionadoId ? "selected" : ""}>${i.nome}</option>`).join("");
  }

  function abrirNovo() {
    document.getElementById("form-turma").reset();
    document.getElementById("turma-id").value = "";
    document.getElementById("tituloModal").textContent = "Nova Turma";
    document.getElementById("erro-turma").classList.add("d-none");
    montarSelectInstrutores(null);
  }

  function abrirEdicao(id) {
    const t = DB.turmas.find((x) => x.id === id);
    document.getElementById("turma-id").value = t.id;
    document.getElementById("turma-nome").value = t.nome;
    document.getElementById("turma-disciplina").value = t.disciplina;
    document.getElementById("turma-turno").value = t.turno;
    document.getElementById("tituloModal").textContent = "Editar Turma";
    document.getElementById("erro-turma").classList.add("d-none");
    montarSelectInstrutores(t.instrutorId);
  }

  function excluir(id) {
    if (!confirm("Excluir esta turma? Matrículas e aulas vinculadas também serão removidas (simulado). Confirmar?")) return;
    DB.turmas = DB.turmas.filter((t) => t.id !== id);
    DB.alunos.forEach((a) => { a.turmas = a.turmas.filter((tid) => tid !== id); });
    DB.aulas = DB.aulas.filter((a) => a.turmaId !== id);
    persistir();
    renderizar();
  }

  document.getElementById("form-turma").addEventListener("submit", function (ev) {
    ev.preventDefault();
    const id = document.getElementById("turma-id").value;
    const nome = document.getElementById("turma-nome").value.trim();
    const disciplina = document.getElementById("turma-disciplina").value.trim();
    const instrutorId = Number(document.getElementById("turma-instrutor").value);
    const turno = document.getElementById("turma-turno").value;
    const erroBox = document.getElementById("erro-turma");

    if (!nome || !disciplina || !instrutorId) { erroBox.textContent = "Nome, disciplina e instrutor são obrigatórios."; erroBox.classList.remove("d-none"); return; }

    if (id) {
      const t = DB.turmas.find((x) => x.id === Number(id));
      Object.assign(t, { nome, disciplina, instrutorId, turno });
    } else {
      const novoId = Math.max(0, ...DB.turmas.map((t) => t.id)) + 1;
      DB.turmas.push({ id: novoId, nome, disciplina, instrutorId, turno });
    }
    persistir();
    bootstrap.Modal.getInstance(document.getElementById("modalTurma")).hide();
    const msg = document.getElementById("msg-sucesso");
    msg.textContent = id ? "Turma atualizada com sucesso." : "Turma cadastrada com sucesso.";
    msg.classList.remove("d-none");
    renderizar();
  });

  renderizar();
  montarLayout("turmas.html");
</script>
</body>
</html>
